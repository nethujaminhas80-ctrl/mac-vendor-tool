<!DOCTYPE html>
<html>
<head>
    <title>MAC Vendor Lookup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background: #0f0f0f; color: white; font-family: Arial; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
        .box { background: #2a2a2a; padding: 30px; border-radius: 15px; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 0 20px rgba(0,255,100,0.2); }
        input { width: 90%; padding: 12px; border-radius: 8px; border: none; margin: 15px 0; }
        button { width: 95%; padding: 12px; background: #00ff88; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .result { margin-top: 20px; padding: 15px; border-radius: 8px; background: #333; }
        .success { color: #00ff88; font-size: 18px; }
        .error { color: #ff5555; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🔍 MAC Vendor Lookup Tool</h2>
        <p>Enter a MAC Address to find the manufacturer</p>
        <form method="POST">
            <input type="text" name="mac" placeholder="e.g., A4-CF-12-34-56-78" value="{{ mac }}" required>
            <button type="submit">Lookup Vendor</button>
        </form>

        {% if vendor %}
        <div class="result">
            <div class="success">✅ {{ vendor }}</div>
            <small>MAC: {{ mac }}</small>
        </div>
        {% endif %}

        {% if error %}
        <div class="result">
            <div class="error">❌ {{ error }}</div>
        </div>
        {% endif %}
    </div>
</body>
</html>
